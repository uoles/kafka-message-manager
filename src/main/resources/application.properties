# src/main/resources/application.properties
server.port=8080
spring.application.name=kafka-message-manager

# Thymeleaf Configuration
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# Logging
logging.level.com.example.kafkaproducer=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.security.authentication=DEBUG

# Kafka producer defaults (can be overridden by request)
spring.kafka.producer.retries=3

spring.datasource.url=jdbc:sqlite:database/kafka-info.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON; PRAGMA busy_timeout=5000;

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Liquibase
spring.liquibase.change-log=classpath:liquibase/changelog-master.xml
spring.liquibase.enabled=true

# Security
security.jwt.issuer=${SECURITY_JWT_ISSUER:kafka-message-manager}
security.jwt.audience=${SECURITY_JWT_AUDIENCE:kafka-message-manager-api}
security.jwt.access-token-ttl=PT15M
security.jwt.private-key=${SECURITY_JWT_PRIVATE_KEY:}
security.jwt.public-key=${SECURITY_JWT_PUBLIC_KEY:}
security.registration.enabled=${SECURITY_REGISTRATION_ENABLED:true}
security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:8080}
security.broker.allowed-addresses=${SECURITY_BROKER_ALLOWED_ADDRESSES:localhost:9092,localhost:29092}
