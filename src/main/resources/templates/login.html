<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - Kafka Message Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-5">
    <section class="card shadow-sm"><div class="card-body p-4">
        <h1 class="h3 mb-3">Sign in</h1>
        <div id="loginMessage" class="alert d-none" role="alert" aria-live="polite"></div>
        <form id="loginForm" novalidate>
            <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div>
            <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
            <button class="btn btn-primary w-100" id="loginButton" type="submit">Sign in</button>
        </form>
        <p class="text-center mt-3 mb-0">No account? <a href="/web/register">Register</a></p>
    </div></section>
</div></div></main>

<script th:src="@{/static/auth.js}"></script>
<script th:src="@{/static/login.js}"></script>
</body></html>
