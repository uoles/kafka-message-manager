<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Kafka Message Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-5">
    <section class="card shadow-sm"><div class="card-body p-4">
        <h1 class="h3 mb-3">Create account</h1>
        <div id="registerMessage" class="alert d-none" role="alert" aria-live="polite"></div>
        <form id="registerForm" novalidate>
            <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" autocomplete="username" required></div>
            <div class="mb-3"><label class="form-label" for="displayName">Display name</label><input class="form-control" id="displayName" name="displayName" autocomplete="name" required></div>
            <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" minlength="12" autocomplete="new-password" required><div class="form-text">Use at least 12 characters.</div></div>
            <div class="mb-4"><label class="form-label" for="passwordConfirmation">Confirm password</label><input class="form-control" id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" required></div>
            <button class="btn btn-primary w-100" id="registerButton" type="submit">Register</button>
        </form>
        <p class="text-center mt-3 mb-0">Already registered? <a href="/web/login">Sign in</a></p>
    </div></section>
</div></div></main>

<script th:src="@{/static/auth.js}"></script>
<script th:src="@{/static/register.js}"></script>
</body></html>
